name: Compilacion Java

on:
  push:
    branches: [ main, master ]

jobs:
  compilar:
    name: compilar y ejecutar Java
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Guardar en directorio
        run: mkdir -p solo-java

      - name: Compilar los archivos .java
        run: javac -d out src/*.java

      - name: Crear Jar
        run: jar cfe out/nombre_archivo.jar Hola -C out .

      - name: Ejecutar Jar
        run: java -jar out/nombre_archivo.jar

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-java
          path: out/nombre_archivo.jar
